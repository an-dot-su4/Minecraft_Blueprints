# Cloudflare Pages の設定。セットアップ手順は docs/setup.md
name = "minecraft-blueprints"
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "minecraft-blueprints"
# `wrangler d1 create minecraft-blueprints` で出た database_id に置き換える
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "minecraft-blueprints"
